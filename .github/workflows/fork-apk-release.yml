name: Fork Android APK release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-apk-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - name: Build the mobile bundle
        env:
          VITE_APK_UPDATE_REPO: default-student/openGym
        run: npm run build:mobile
        working-directory: frontend
      - name: Build the single fork APK
        run: ./gradlew --no-daemon assembleSideloadRelease
        working-directory: frontend/android
      - name: Sign and verify the APK
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_B64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          VERSION="$(node -p "require('./frontend/package.json').version")"
          APK="$RUNNER_TEMP/openGym-$VERSION.apk"
          UNSIGNED="frontend/android/app/build/outputs/apk/sideload/release/app-sideload-release-unsigned.apk"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/openGym-LH-release.jks"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/openGym-LH-aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/openGym-LH-release.jks" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out "$APK" "$RUNNER_TEMP/openGym-LH-aligned.apk"
          "$BT/apksigner" verify --print-certs "$APK"
          sha256sum "$APK" > "$APK.sha256"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "APK_SHA_PATH=$APK.sha256" >> "$GITHUB_ENV"
          echo "APK_VERSION=$VERSION" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/openGym-LH-release.jks" "$RUNNER_TEMP/openGym-LH-aligned.apk"
      - name: Publish one APK on the fork release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$APK_VERSION"
          gh release create "$TAG" "$APK_PATH" "$APK_SHA_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "openGym LH $APK_VERSION" \
            --notes "Normal sideloaded Android APK for the openGym fork. This release contains one APK built by the fork pipeline." \
            --latest
